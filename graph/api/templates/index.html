<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icelandic Github Graph</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.29.2/cytoscape.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #0f1117;
        color: #e0e0e0;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      #top {
        padding: 12px 20px;
        background: #1a1d27;
        border-bottom: 1px solid #2a2d3a;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      #top h1 {
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        flex-shrink: 0;
      }

      .search-wrap {
        position: relative;
      }
      .search-wrap input {
        padding: 7px 12px;
        background: #252836;
        border: 1px solid #3a3d4a;
        border-radius: 6px;
        color: #e0e0e0;
        font-size: 14px;
        width: 200px;
        outline: none;
      }
      .search-wrap input:focus {
        border-color: #5b8dee;
      }
      .search-wrap input::placeholder {
        color: #555;
      }
      .ac-dropdown {
        display: none;
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        z-index: 99;
        background: #252836;
        border: 1px solid #3a3d4a;
        border-radius: 6px;
        min-width: 200px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }
      .ac-dropdown div {
        padding: 8px 12px;
        font-size: 13px;
        cursor: pointer;
        color: #e0e0e0;
      }
      .ac-dropdown div:hover,
      .ac-dropdown div.ac-active {
        background: #2e3146;
      }

      .arrow {
        color: #444;
        font-size: 18px;
        flex-shrink: 0;
      }

      #find-btn {
        padding: 7px 18px;
        background: #5b8dee;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        font-weight: 500;
      }
      #find-btn:hover {
        background: #4a7be0;
      }
      #find-btn:disabled {
        background: #333;
        color: #555;
        cursor: default;
      }

      @media (max-width: 600px) {
        #top {
          flex-direction: column;
          align-items: stretch;
          padding: 12px;
          gap: 8px;
        }
        #top h1 {
          text-align: center;
        }
        .search-wrap input {
          width: 100%;
        }
        .arrow {
          text-align: center;
          font-size: 14px;
        }
        #find-btn {
          width: 100%;
          padding: 10px;
          font-size: 15px;
        }
        #panel {
          width: 100%;
          top: auto;
          bottom: 0;
          height: 60vh;
          border-left: none;
          border-top: 1px solid #2a2d3a;
          transform: translateY(100%);
        }
        #panel.open {
          transform: translateY(0);
        }
      }

      #status {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: #1a1d27;
        border: 1px solid #3a3d4a;
        border-radius: 20px;
        padding: 7px 18px;
        font-size: 14px;
        font-weight: 500;
        color: #d0d0d0;
        white-space: nowrap;
        pointer-events: none;
        z-index: 5;
        display: none;
      }
      #status.visible {
        display: block;
      }
      #status.error {
        color: #e57373;
        border-color: #5a2a2a;
        background: #1f1517;
      }

      #main {
        flex: 1;
        display: flex;
        overflow: hidden;
        position: relative;
      }
      #cy {
        flex: 1;
      }

      /* ── Popup panel ── */
      #panel {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 280px;
        background: #1a1d27;
        border-left: 1px solid #2a2d3a;
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.2s ease;
        z-index: 10;
      }
      #panel.open {
        transform: translateX(0);
      }

      #panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px 12px;
        border-bottom: 1px solid #2a2d3a;
        flex-shrink: 0;
      }
      #panel-title {
        font-size: 11px;
        font-weight: 600;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      #panel-close {
        background: none;
        border: none;
        color: #555;
        font-size: 18px;
        cursor: pointer;
        line-height: 1;
        padding: 0 2px;
      }
      #panel-close:hover {
        color: #e0e0e0;
      }

      #panel-body {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
      }

      /* node panel */
      .p-avatar {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        object-fit: cover;
        float: right;
        margin: 0 0 8px 12px;
      }
      .p-name {
        font-size: 15px;
        font-weight: 600;
        color: #fff;
      }
      .p-user {
        font-size: 12px;
        color: #666;
        margin-bottom: 10px;
      }
      .p-clear {
        clear: both;
      }
      .p-stat {
        font-size: 13px;
        color: #aaa;
        margin: 5px 0;
      }
      .p-stat b {
        color: #e0e0e0;
      }
      .p-link {
        display: inline-block;
        margin-top: 12px;
        font-size: 12px;
        color: #5b8dee;
        text-decoration: none;
      }
      .p-link:hover {
        text-decoration: underline;
      }

      .p-divider {
        border: none;
        border-top: 1px solid #2a2d3a;
        margin: 14px 0;
      }

      .p-expand-btn {
        width: 100%;
        padding: 8px 12px;
        background: #252836;
        border: 1px solid #3a3d4a;
        border-radius: 6px;
        color: #ccc;
        font-size: 13px;
        cursor: pointer;
        text-align: center;
        transition: border-color 0.15s;
      }
      .p-expand-btn:hover {
        border-color: #5b8dee;
        color: #fff;
      }
      .p-expand-btn.expanded {
        border-color: #5b8dee;
        color: #5b8dee;
      }
      .p-expand-btn:disabled {
        color: #444;
        cursor: default;
        border-color: #2a2d3a;
      }

      /* edge header */
      .p-edge-header {
        font-size: 13px;
        color: #aaa;
        margin-bottom: 14px;
        line-height: 1.8;
      }
      .p-edge-header b {
        color: #e0e0e0;
      }
      .p-edge-pill {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 600;
        margin: 0 2px;
      }

      /* edge panel */
      .p-rel-card {
        background: #1f2233;
        border-radius: 6px;
        padding: 10px 12px;
        margin-bottom: 8px;
      }
      .p-rel-type {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        margin-bottom: 5px;
      }
      .p-rel-desc {
        font-size: 13px;
        color: #d0d0d0;
        line-height: 1.4;
      }
      .p-rel-desc b {
        color: #fff;
      }
      .p-rel-repos {
        margin-top: 7px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .p-rel-repo {
        font-size: 12px;
        color: #5b8dee;
        text-decoration: none;
      }
      .p-rel-repo:hover {
        text-decoration: underline;
      }
      .p-no-rel {
        font-size: 13px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div id="top">
      <h1>Icelandic Github Graph</h1>

      <div class="search-wrap">
        <input
          type="search"
          id="input-a"
          placeholder="From user…"
          autocomplete="off"
          data-lpignore="true"
          data-form-type="other"
        />
        <div class="ac-dropdown" id="ac-a"></div>
      </div>

      <span class="arrow">→</span>

      <div class="search-wrap">
        <input
          type="search"
          id="input-b"
          placeholder="To user…"
          autocomplete="off"
          data-lpignore="true"
          data-form-type="other"
        />
        <div class="ac-dropdown" id="ac-b"></div>
      </div>

      <button id="find-btn" onclick="findPath()">Find path</button>
    </div>

    <div id="main">
      <div id="status"></div>
      <div id="cy"></div>

      <div id="panel">
        <div id="panel-header">
          <span id="panel-title">Info</span>
          <button id="panel-close" onclick="closePanel()">×</button>
        </div>
        <div id="panel-body"></div>
      </div>
    </div>

    <script>
      const API = "";

      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function updateFindBtn() {
        const a = document.getElementById("input-a").value.trim();
        const b = document.getElementById("input-b").value.trim();
        document.getElementById("find-btn").textContent =
          (a ? 1 : 0) + (b ? 1 : 0) === 1 ? "Find user" : "Find path";
      }
      document
        .getElementById("input-a")
        .addEventListener("input", updateFindBtn);
      document
        .getElementById("input-b")
        .addEventListener("input", updateFindBtn);

      // rel type priority for picking the "best" edge label
      const REL_PRIORITY = {
        Contributor: 3,
        OrgMember: 2,
        Follows: 1,
        Following: 1,
        Follower: 1,
      };
      const REL_COLOR = {
        Contributor: "#f0a500",
        OrgMember: "#5b8dee",
        Follows: "#4caf8a",
        Following: "#4caf8a",
        Follower: "#4caf8a",
      };

      function relPriority(type) {
        return REL_PRIORITY[type] ?? 0;
      }

      function relDesc(r) {
        const s = `<b>${esc(r.source)}</b>`,
          t = `<b>${esc(r.target)}</b>`;
        const c = REL_COLOR[r.relationship_type] || "#888";
        const v = (txt) =>
          `<span style="color:${c};font-weight:600">${txt}</span>`;
        switch (r.relationship_type) {
          case "Follows":
          case "Following":
          case "Follower":
            return `${s} ${v("follows")} ${t}`;
          case "OrgMember":
            return `${s} ${v("is a member of")} ${t}`;
          case "Contributor":
            return `${s} ${v("contributed to")} ${t}'s repos`;
          case "Collaborator":
            return `${s} ${v("collaborated on")} ${t}'s repos`;
          default:
            return `${s} ${v("→")} ${t}`;
        }
      }

      // ── Cytoscape ────────────────────────────────────────────────────────────────
      const cy = cytoscape({
        container: document.getElementById("cy"),
        style: [
          {
            selector: "node",
            style: {
              "background-color": "#2e3146",
              "background-image": "data(avatar)",
              "background-fit": "cover",
              "background-clip": "node",
              label: "data(id)",
              color: "#e0e0e0",
              "text-outline-color": "#0f1117",
              "text-outline-width": 2,
              "font-size": 11,
              "text-valign": "bottom",
              "text-margin-y": 5,
              width: 48,
              height: 48,
              "border-width": 2,
              "border-color": "#3a3d4a",
            },
          },
          {
            selector: "node.endpoint",
            style: {
              "background-color": "#1a3a5c",
              "border-color": "#5b8dee",
              "border-width": 3,
              width: 64,
              height: 64,
              "font-size": 13,
              "font-weight": "bold",
            },
          },
          {
            selector: "node:selected",
            style: { "border-color": "#f0a500", "border-width": 3 },
          },
          {
            selector: "edge",
            style: {
              width: 1.5,
              "line-color": "#2a2d3a",
              "target-arrow-color": "#2a2d3a",
              "target-arrow-shape": "triangle",
              "arrow-scale": 0.7,
              "curve-style": "bezier",
              label: "data(label)",
              "font-size": 10,
              color: "#555",
              "text-outline-color": "#0f1117",
              "text-outline-width": 1.5,
              "text-rotation": "autorotate",
            },
          },
          {
            selector: "edge.path-edge",
            style: {
              "line-color": "data(edgeColor)",
              "target-arrow-color": "data(edgeColor)",
              width: 3,
              color: "#888",
            },
          },
          {
            selector: "edge:selected",
            style: { "line-color": "#f0a500", "target-arrow-color": "#f0a500" },
          },
        ],
        layout: { name: "preset" },
        wheelSensitivity: 0.3,
      });

      cy.on("tap", "node", (e) => showNodePanel(e.target.data()));
      cy.on("tap", "edge", (e) => showEdgePanel(e.target.data()));
      cy.on("tap", (e) => {
        if (e.target === cy) closePanel();
      });

      // ── Panel ────────────────────────────────────────────────────────────────────
      function openPanel(title, html) {
        document.getElementById("panel-title").textContent = title;
        document.getElementById("panel-body").innerHTML = html;
        document.getElementById("panel").classList.add("open");
      }

      function closePanel() {
        document.getElementById("panel").classList.remove("open");
      }

      // ── Node panel ───────────────────────────────────────────────────────────────
      async function showNodePanel(data) {
        const isExpanded = expandedMap.has(data.id);
        const expandedCount = isExpanded ? expandedMap.get(data.id).size : null;

        // Use cached neighbor_count if available, otherwise fetch
        let neighborCount = data.neighbor_count ?? null;
        if (neighborCount === null) {
          try {
            const r = await fetch(`${API}/user/${encodeURIComponent(data.id)}`);
            if (r.ok) {
              const d = await r.json();
              neighborCount = d.neighbor_count;
            }
          } catch {}
        }

        const countLabel = neighborCount !== null ? ` (${neighborCount})` : "";
        const btnLabel = isExpanded
          ? `Collapse connections (${expandedCount})`
          : `Expand connections${countLabel}`;

        openPanel(
          "User",
          `
    ${data.avatar ? `<img class="p-avatar" src="${esc(data.avatar)}" alt="">` : ""}
    <div class="p-name">${esc(data.name || data.id)}</div>
    <div class="p-user">@${esc(data.id)}</div>
    <div class="p-clear"></div>
    <hr class="p-divider">
    <div class="p-stat">Repos: <b>${esc(data.repos_count ?? "—")}</b></div>
    ${data.location ? `<div class="p-stat">Location: <b>${esc(data.location)}</b></div>` : ""}
    ${data.company ? `<div class="p-stat">Company: <b>${esc(data.company)}</b></div>` : ""}
    <div class="p-stat">Type: <b>${esc(data.account_type || "—")}</b></div>
    <div class="p-stat">Icelandic: <b>${{ Confirmed: "Yes", Hidden: "No" }[data.status] ?? "Unknown"}</b></div>
    <a class="p-link" href="https://github.com/${esc(data.id)}" target="_blank">View on GitHub ↗</a>
    <hr class="p-divider">
    <button class="p-expand-btn${isExpanded ? " expanded" : ""}" id="expand-btn"
      onclick="toggleExpand('${esc(data.id)}', this)">${esc(btnLabel)}</button>
  `,
        );
      }

      // ── Edge panel ───────────────────────────────────────────────────────────────
      async function showEdgePanel(data) {
        const { source, target } = data;
        openPanel(
          "All Relationships",
          `
    <div class="p-edge-header"><b>${esc(source)}</b> ↔ <b>${esc(target)}</b></div>
    <div style="color:#555;font-size:12px">Loading…</div>
  `,
        );

        try {
          const res = await fetch(
            `${API}/relationships/${encodeURIComponent(source)}/${encodeURIComponent(target)}`,
          );
          const json = await res.json();
          const rels = json.relationships || [];
          const sorted = rels.sort(
            (a, b) =>
              relPriority(b.relationship_type) -
              relPriority(a.relationship_type),
          );

          const rows = sorted.length
            ? sorted
                .map((r) => {
                  const repoLinks = r.repos
                    ? r.repos
                        .split(",")
                        .map(
                          (repo) =>
                            `<a class="p-rel-repo" href="https://github.com/${repo}" target="_blank">${repo}</a>`,
                        )
                        .join("")
                    : "";
                  return `<div class="p-rel-card">
            <div class="p-rel-desc">${relDesc(r)}</div>
            ${repoLinks ? `<div class="p-rel-repos">${repoLinks}</div>` : ""}
          </div>`;
                })
                .join("")
            : `<div class="p-no-rel">No relationships found</div>`;

          document.getElementById("panel-body").innerHTML = `
      <div class="p-edge-header"><b>${esc(source)}</b> ↔ <b>${esc(target)}</b></div>
      ${rows}
    `;
        } catch {
          document.getElementById("panel-body").innerHTML =
            `<div class="p-no-rel">Error loading relationships</div>`;
        }
      }

      // ── Expand ───────────────────────────────────────────────────────────────────
      const pathNodeIds = new Set();
      const expandedMap = new Map();
      const edgeRelTypes = new Map(); // pairId → Set of rel types seen (deduplicates on re-expand)

      async function toggleExpand(nodeId, btn) {
        if (expandedMap.has(nodeId)) {
          collapseNode(nodeId, btn);
        } else {
          await expandNode(nodeId, btn);
        }
      }

      async function expandNode(nodeId, btn) {
        btn.disabled = true;
        btn.textContent = "Loading…";

        try {
          const res = await fetch(
            `${API}/neighbors/${encodeURIComponent(nodeId)}`,
          );
          if (!res.ok) {
            btn.textContent = "No connections";
            btn.disabled = false;
            return;
          }
          const data = await res.json();

          if (data.total === 0) {
            btn.textContent = "No connections";
            btn.disabled = false;
            return;
          }

          const center = cy.getElementById(nodeId).position();
          const radius = 200;
          const newNodes = data.nodes.filter(
            (n) => !cy.getElementById(n.id).length,
          );
          const addedIds = new Set();

          newNodes.forEach((n, i) => {
            const angle =
              (2 * Math.PI * i) / Math.max(newNodes.length, 1) - Math.PI / 2;
            cy.add({
              group: "nodes",
              data: n,
              position: {
                x: center.x + radius * Math.cos(angle),
                y: center.y + radius * Math.sin(angle),
              },
            });
            addedIds.add(n.id);
          });

          // add edges, one per pair (best relationship type wins)
          data.edges.forEach((e) => addEdge(e));

          expandedMap.set(nodeId, addedIds);

          if (addedIds.size === 0) {
            btn.textContent = "All connections visible";
            btn.disabled = true;
          } else {
            const label =
              data.total > data.nodes.length
                ? `Collapse (${data.nodes.length} of ${data.total})`
                : `Collapse connections (${data.total})`;
            btn.textContent = label;
            btn.className = "p-expand-btn expanded";
            btn.disabled = false;
          }
        } catch {
          btn.textContent = "Error loading";
          btn.disabled = false;
        }
      }

      function collapseNode(nodeId, btn) {
        const addedIds = expandedMap.get(nodeId) || new Set();
        expandedMap.delete(nodeId);

        const protected_ = new Set(pathNodeIds);
        expandedMap.forEach((ids) => ids.forEach((id) => protected_.add(id)));

        addedIds.forEach((id) => {
          if (!protected_.has(id)) cy.getElementById(id).remove();
        });

        btn.textContent = "Expand connections";
        btn.className = "p-expand-btn";
        btn.disabled = false;
      }

      function edgeLabel(type, count) {
        return count > 1 ? `${type} (${count})` : type;
      }

      // Add edge, deduplicating per pair. Tracks distinct rel types via Set so re-expanding doesn't inflate the count.
      function addEdge(e, classes = "") {
        const pairId = [e.source, e.target].sort().join("__");
        if (!edgeRelTypes.has(pairId)) edgeRelTypes.set(pairId, new Set());
        edgeRelTypes.get(pairId).add(e.relationship_type);
        const count = edgeRelTypes.get(pairId).size;

        const existing = cy.getElementById(pairId);
        if (existing.length) {
          if (
            relPriority(e.relationship_type) >
            relPriority(existing.data("relationship_type"))
          ) {
            existing.data({
              relationship_type: e.relationship_type,
              edgeColor: REL_COLOR[e.relationship_type] || "#3a3d4a",
              shared_repos: e.shared_repos,
            });
          }
          existing.data(
            "label",
            edgeLabel(existing.data("relationship_type"), count),
          );
          return;
        }
        cy.add({
          group: "edges",
          data: {
            id: pairId,
            source: e.source,
            target: e.target,
            relationship_type: e.relationship_type,
            label: edgeLabel(e.relationship_type, count),
            edgeColor: REL_COLOR[e.relationship_type] || "#3a3d4a",
            shared_repos: e.shared_repos,
          },
          classes,
        });
      }

      // ── Autocomplete ─────────────────────────────────────────────────────────────
      function setupAutocomplete(inputId, dropdownId) {
        const input = document.getElementById(inputId);
        const dropdown = document.getElementById(dropdownId);
        let timer;
        let activeIdx = -1;
        let inflight = null;

        function items() {
          return dropdown.querySelectorAll("div");
        }

        function setActive(idx) {
          items().forEach((el, i) =>
            el.classList.toggle("ac-active", i === idx),
          );
          activeIdx = idx;
        }

        function hide() {
          dropdown.style.display = "none";
          dropdown.innerHTML = "";
          activeIdx = -1;
        }

        async function fetch_ac(q) {
          if (inflight) inflight.abort();
          inflight = new AbortController();
          activeIdx = -1;
          try {
            const res = await fetch(
              `${API}/autocomplete?q=${encodeURIComponent(q)}`,
              { signal: inflight.signal },
            );
            const data = await res.json();
            const results = data.results || [];
            if (!results.length) {
              hide();
              return;
            }
            dropdown.innerHTML = results
              .map(
                (u) =>
                  `<div onmousedown="selectAc('${inputId}','${dropdownId}','${u}')">${u}</div>`,
              )
              .join("");
            dropdown.style.display = "block";
          } catch (e) {
            if (e.name !== "AbortError") hide();
          }
        }

        input.addEventListener("focus", () => {
          clearTimeout(timer);
          timer = setTimeout(() => fetch_ac(input.value.trim()), 200);
        });
        input.addEventListener("input", () => {
          clearTimeout(timer);
          if (inflight) {
            inflight.abort();
            inflight = null;
          }
          hide();
          timer = setTimeout(() => fetch_ac(input.value.trim()), 400);
        });
        input.addEventListener("blur", () => {
          setTimeout(hide, 150);
        });
        input.addEventListener("keydown", (e) => {
          const list = items();
          const open = dropdown.style.display !== "none";
          if (e.key === "ArrowDown") {
            e.preventDefault();
            if (open) setActive(Math.min(activeIdx + 1, list.length - 1));
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            if (open) setActive(Math.max(activeIdx - 1, 0));
          } else if (e.key === "Enter") {
            if (open) {
              if (activeIdx >= 0 && list[activeIdx])
                input.value = list[activeIdx].textContent;
              else if (list.length) input.value = list[0].textContent;
            }
            hide();
            updateFindBtn();
            findPath();
          } else if (e.key === "Escape") {
            hide();
          }
        });
      }

      function selectAc(inputId, dropdownId, value) {
        const input = document.getElementById(inputId);
        const dropdown = document.getElementById(dropdownId);
        input.value = value;
        dropdown.style.display = "none";
        dropdown.innerHTML = "";
        updateFindBtn();
        findPath();
      }

      setupAutocomplete("input-a", "ac-a");
      setupAutocomplete("input-b", "ac-b");

      // ── Path finding ─────────────────────────────────────────────────────────────
      function setStatus(msg, isError = false) {
        const el = document.getElementById("status");
        el.textContent = msg;
        el.className = msg ? "visible" + (isError ? " error" : "") : "";
      }

      async function findPath() {
        const a = document.getElementById("input-a").value.trim();
        const b = document.getElementById("input-b").value.trim();
        if (!a && !b) return;

        const btn = document.getElementById("find-btn");
        btn.disabled = true;
        cy.elements().remove();
        closePanel();
        pathNodeIds.clear();
        expandedMap.clear();
        edgeRelTypes.clear();

        if ((a && !b) || (!a && b)) {
          const username = a || b;
          setStatus("Looking up user…");
          try {
            const res = await fetch(
              `${API}/user/${encodeURIComponent(username)}`,
            );
            if (!res.ok) {
              const e = await res.json();
              setStatus(e.detail || "Not found", true);
              return;
            }
            const node = await res.json();
            const cx = document.getElementById("cy").offsetWidth / 2;
            const cy_ = document.getElementById("cy").offsetHeight / 2;
            cy.add({
              group: "nodes",
              data: node,
              position: { x: cx, y: cy_ },
              classes: "endpoint",
            });
            pathNodeIds.add(node.id);
            setStatus(`${node.id} — expanding connections…`);
            await expandNode(node.id, {
              disabled: false,
              textContent: "",
              className: "p-expand-btn",
            });
            setStatus(node.id);
          } catch {
            setStatus("API unreachable — is the server running?", true);
          } finally {
            btn.disabled = false;
          }
          return;
        }

        setStatus("Finding path…");
        try {
          const res = await fetch(
            `${API}/shortest-path?source=${encodeURIComponent(a)}&target=${encodeURIComponent(b)}`,
          );
          if (!res.ok) {
            const err = await res.json();
            setStatus(err.detail || "Not found", true);
            return;
          }
          const data = await res.json();
          renderPath(data);
          if (data.no_path) setStatus("No path found", true);
        } catch {
          setStatus("API unreachable — is the server running?", true);
        } finally {
          btn.disabled = false;
        }
      }

      function renderPath(data) {
        const { nodes, edges } = data;
        if (nodes.length === 0) {
          setStatus("No path found", true);
          return;
        }

        const spacing = Math.min(180, Math.max(120, 900 / nodes.length));
        const cy_w = document.getElementById("cy").offsetWidth;
        const total_w = spacing * (nodes.length - 1);
        const start_x = (cy_w - total_w) / 2;
        const y = document.getElementById("cy").offsetHeight / 2;

        nodes.forEach((n, i) => {
          cy.add({
            group: "nodes",
            data: n,
            position: { x: start_x + i * spacing, y },
            classes: "endpoint",
          });
          pathNodeIds.add(n.id);
        });

        edges.forEach((e) => addEdge(e, "path-edge"));

        if (!data.no_path) {
          const hops = nodes.length - 1;
          setStatus(`${hops} hop${hops !== 1 ? "s" : ""}`);
        }
      }
    </script>
  </body>
</html>
